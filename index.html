<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クリア報告</title>
<script>
const text = "イロドリミドリの謎を解き明かした！" + "\n" + "https://iatlab.booth.pm/";
const hashtags = "謎解き,IAT_Lab,イロドリミドリ";

// 画像カードのURLを自動取得
const cardUrl = new URL("card.html", location.href).href;

// Xの投稿URLを生成
const params = new URLSearchParams({
  text: text,
  hashtags: hashtags,
  url: cardUrl
});

// 即座にXへ移動
location.replace(
  "https://x.com/intent/tweet?" + params.toString()
);
</script>
</head>
<body></body>
</html>
