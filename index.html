
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イロドリミドリ CLEAR!</title>

<!-- Xカード・OGP設定 -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="イロドリミドリ CLEAR!">
<meta name="twitter:description" content="イロドリミドリの謎を解き明かした！">
<meta name="twitter:image"
 content="https://chiha0405.github.io/irodorimidori_post/clear.png">

<meta property="og:title" content="イロドリミドリ CLEAR!">
<meta property="og:description" content="イロドリミドリの謎を解き明かした！">
<meta property="og:image"
 content="https://chiha0405.github.io/irodorimidori_post/clear.png">

<script>
const base = "https://chiha0405.github.io/irodorimidori_post/";
const booth = "https://iatlab.booth.pm/";

if (new URLSearchParams(location.search).has("share")) {

  // クリア報告用
  const text = [
    "イロドリミドリの謎を解き明かした！",
    "",
    "#謎解き #IAT_Lab #イロドリミドリ"
  ].join("\n");

  const params = new URLSearchParams({
    text: text,
    url: base
  });

  location.replace(
    "https://x.com/intent/tweet?" + params.toString()
  );

} else {

  // Xカードをクリックした人はBOOTHへ
  location.replace(booth);

}
</script>
</head>
<body></body>
</html>
